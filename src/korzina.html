<title>Корзина на неделю</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style — large title per section that collapses into a glass top bar, solid inset-grouped cards for content,
   a floating glass tab bar at the bottom and glass bottom sheets for details. Soft colour blobs sit behind the glass. */
:root{
  --bg:#EEF2EE; --blob1:#BFE3CC; --blob2:#F6D9C4; --blob3:#CFE0F2;
  --surface:#FFFFFF; --fill:rgba(118,128,120,.12); --ink:#111613; --muted:#6B746E; --line:rgba(60,67,62,.14);
  --accent:#2E7D55; --accent-ink:#FFFFFF; --accent-soft:rgba(46,125,85,.12);
  --beet:#C0304F; --warn:#9A6100; --warn-soft:#F6EBD3; --cool:#2F6DB5;
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9); --shadow:rgba(20,30,25,.12);
  --dim:rgba(10,15,12,.28); --sunk:var(--fill);
  --font:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D0B; --blob1:#123B27; --blob2:#3A2416; --blob3:#14263B;
  --surface:#1A1F1C; --fill:rgba(200,215,205,.1); --ink:#F2F5F3; --muted:#98A29B; --line:rgba(235,245,238,.1);
  --accent:#4CC38A; --accent-ink:#06130C; --accent-soft:rgba(76,195,138,.16);
  --beet:#FF8AA6; --warn:#E3B45C; --warn-soft:#3A2F17; --cool:#7FB2F0;
  --glass:rgba(38,44,40,.55); --glass-edge:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.18); --shadow:rgba(0,0,0,.45);
  --dim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D0B; --blob1:#123B27; --blob2:#3A2416; --blob3:#14263B;
  --surface:#1A1F1C; --fill:rgba(200,215,205,.1); --ink:#F2F5F3; --muted:#98A29B; --line:rgba(235,245,238,.1);
  --accent:#4CC38A; --accent-ink:#06130C; --accent-soft:rgba(76,195,138,.16);
  --beet:#FF8AA6; --warn:#E3B45C; --warn-soft:#3A2F17; --cool:#7FB2F0;
  --glass:rgba(38,44,40,.55); --glass-edge:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.18); --shadow:rgba(0,0,0,.45);
  --dim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
/* colour wash behind the glass: soft gradients over the whole screen, reaching under the status bar and home indicator */
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100lvh}
.backdrop{position:fixed;z-index:0;pointer-events:none;left:-40px;right:-40px;top:calc(-1 * env(safe-area-inset-top,0px) - 60px);height:calc(100vh + 400px);height:calc(100lvh + 400px);background-size:100% calc(100lvh + 120px)!important;background-repeat:no-repeat!important;
  background:radial-gradient(70% 45% at 8% 8%,var(--blob1),transparent 72%),radial-gradient(65% 45% at 96% 50%,var(--blob2),transparent 72%),radial-gradient(75% 45% at 12% 96%,var(--blob3),transparent 72%),var(--bg)}
.backdrop i{display:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px var(--shadow)}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.wrap.wide{max-width:1120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 -16px;padding:16px 16px 8px;border-radius:0 0 18px 18px;border-top:0;transition:background .2s,box-shadow .2s,border-color .2s}
.topbar:not(.on){background:transparent;box-shadow:none;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar .t{text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.topbar.on .t{opacity:1}
.gear{grid-column:3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.gear svg{width:20px;height:20px}
.gear[aria-pressed="true"]{color:var(--accent)}

h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px;line-height:1.1}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:600}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch;font-size:15px}
.sechead{margin:4px 0 16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:0;background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;box-shadow:0 1px 2px var(--shadow);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent)}
.btn.danger{color:var(--beet)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn:active{transform:scale(.97)}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab:focus,.gear:focus,.btn:focus{outline:none}
.tab:focus-visible,.gear:focus-visible,.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{background:var(--fill);border:0;border-radius:12px;padding:11px 12px;min-width:0;color:var(--ink);font-size:16px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
textarea{width:100%;resize:vertical;min-height:150px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:10px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--muted);background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{opacity:1}
input[type=checkbox]:active{transform:scale(.9)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--ink);font-size:15px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px var(--shadow);min-width:0}
.card+.card{margin-top:16px}
.gtitle{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px 16px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-soft);border-radius:16px;padding:12px 14px;margin:0 0 16px;font-size:15px}
.banner b{color:var(--warn)}
.status{margin-top:10px;min-height:1.2em;font-size:14px;color:var(--muted)}
.status:empty{display:none}
.status.err{color:var(--beet)}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);font-size:14px}
.warnf{box-shadow:inset 0 0 0 2px var(--warn)!important}
.copied{color:var(--accent);font-size:14px}
.empty{color:var(--muted);padding:24px 8px;text-align:center}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--fill)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;padding:9px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--fill);border-radius:999px;padding:2px}
.stepper button{border:0;background:var(--surface);border-radius:50%;width:28px;height:28px;line-height:1;cursor:pointer;padding:0;color:var(--ink);font-size:17px;box-shadow:0 1px 2px var(--shadow)}
.stepper button:disabled{opacity:.35}
.stepper .v{min-width:4.6em;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-t b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.prog-t span{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.prog.alldone{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog.alldone b{color:var(--accent);font-size:20px}

/* shopping rows */
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 12px 11px 16px;position:relative;min-height:54px}
.item+.item::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line)}
.item .nm{font-weight:500;overflow-wrap:break-word;min-width:0;cursor:pointer}
/* what the recipes really use, under the name, when it differs from the pack you buy */
.item .need{display:block;font-size:13px;font-weight:500;color:var(--accent);margin-top:1px;font-variant-numeric:tabular-nums}
.item.done .need{color:var(--muted)}
.item.done .nm,.item.done .qty{color:var(--muted);text-decoration:line-through}
.qty{border:0;background:none;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:6px 0;text-align:right;font-variant-numeric:tabular-nums;max-width:12em}
button.qty{cursor:pointer}
.qty svg{width:14px;height:14px;flex:none;opacity:.7}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input[type=text]{flex:2 1 140px}
.addrow input[type=number]{flex:1 1 70px;width:80px}

/* week */
.week{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:720px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
.day{background:var(--surface);border-radius:var(--r);padding:14px 14px 12px;box-shadow:0 1px 2px var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{box-shadow:0 0 0 2px var(--accent),0 1px 2px var(--shadow)}
.dayname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:18px}
.dayname .tod{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.kcal{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.norm{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.norm.over{color:var(--beet);background:color-mix(in srgb,var(--beet) 14%,transparent)}
.norm.under{color:var(--cool);background:color-mix(in srgb,var(--cool) 14%,transparent)}
.norm.ok{color:var(--accent);background:var(--accent-soft)}
.meal{display:flex;flex-direction:column;gap:6px}
.meal-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dish{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 8px 8px 12px}
.dish .dn{font-weight:500;overflow-wrap:break-word;min-width:0;font-size:15px}
.chevb{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0}
.chevb svg{width:16px;height:16px}
.add-dish{width:100%;font-size:14px;color:var(--muted);background-color:transparent!important;border:1.5px dashed var(--line)!important;border-radius:12px;padding:9px 12px}

/* recipes */
.recipes{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.recipes{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}.recipes.solo{grid-template-columns:minmax(0,720px)}}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:12px 12px 12px 16px;cursor:pointer;position:relative;color:var(--ink)}
.ritem+.ritem::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.ritem[aria-current="true"]{background:var(--accent-soft)}
.ritem .t{font-weight:500;overflow-wrap:break-word}
.ritem svg{width:14px;height:14px;color:var(--muted)}
.rmeta{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.rmeta span:first-child{color:var(--ink);font-weight:500}
.rhead{display:flex;flex-direction:column;gap:10px}
.nut{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nut span{background:var(--fill);border-radius:999px;padding:5px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.nut b{font-weight:700}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings li .q{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.ings li.pantry .n::after{content:"обычно есть дома";font-size:12px;color:var(--muted);margin-left:8px}
.cat h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:16px 0 4px}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-right:0}
.aib{display:inline-flex;align-items:center;gap:4px;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 9px 3px 7px;border-radius:999px}
.aib svg{width:13px;height:13px}
.blk{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0;padding-top:0}
.btn.wide{width:100%;padding:13px 16px}
.blk .row{flex-direction:column;align-items:stretch}
.addhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
#impText{min-height:110px}
.addplan{display:flex;flex-direction:column;gap:10px}
.addq{color:var(--accent);font-weight:500}
.mic{width:14px;height:14px;vertical-align:-2px}
.btn .shi{width:16px;height:16px;flex:none}
.btn .pen{width:16px;height:16px;flex:none}
.manual .link{font-size:15px;font-weight:500}
.ways{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.way{border:0;border-radius:16px;background:var(--fill);color:var(--ink);padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.way b{font-size:16px;font-weight:600}
.way span{font-size:12px;color:var(--muted);line-height:1.25}
.way.primary{background:var(--accent);color:var(--accent-ink)}
.way.primary span{color:var(--accent-ink);opacity:.8}
.way:active{transform:scale(.97)}
.way:disabled{opacity:.6}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1;padding:0}
.editor-rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.erow{display:grid;grid-template-columns:minmax(0,3fr) 74px 96px minmax(0,2fr) auto;gap:6px;align-items:center}
.erow input,.erow select{width:100%}
.erow>button{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%}
@media (max-width:600px){.erow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) auto;grid-template-areas:"n n n x" "q u c c";padding-bottom:10px;border-bottom:1px solid var(--line)}.erow [data-f=name]{grid-area:n}.erow [data-f=qty]{grid-area:q}.erow [data-f=unit]{grid-area:u}.erow [data-f=cat]{grid-area:c}.erow>button{grid-area:x}}

/* settings */
.plist{max-height:420px;overflow:auto;border-radius:12px;background:var(--fill)}
.prow{padding:10px 12px}
.prow+.prow{border-top:1px solid var(--line)}
.prow .pn{font-weight:500;font-size:15px}
.prow .pm{font-size:13px;color:var(--muted);margin-top:2px}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.sw button{border:0;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0}
.sw i{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.sw button[aria-checked="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.sw button[aria-checked="true"]{color:var(--ink);font-weight:600}
.hue{width:100%;height:30px;-webkit-appearance:none;appearance:none;background:transparent;margin:4px 0 0}
.hue::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:linear-gradient(90deg,hsl(0,70%,70%),hsl(60,70%,70%),hsl(120,70%,70%),hsl(180,70%,70%),hsl(240,70%,70%),hsl(300,70%,70%),hsl(360,70%,70%))}
.hue::-moz-range-track{height:14px;border-radius:99px;background:linear-gradient(90deg,hsl(0,70%,70%),hsl(60,70%,70%),hsl(120,70%,70%),hsl(180,70%,70%),hsl(240,70%,70%),hsl(300,70%,70%),hsl(360,70%,70%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hue::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.disc{width:100%;border:0;background:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--ink)}
.disc b{font-weight:600}
.disc .val{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc svg{width:16px;height:16px;flex:none;transition:transform .2s}
.disc[aria-expanded="true"] svg{transform:rotate(90deg)}
.discbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ginner{padding:16px;display:flex;flex-direction:column;gap:12px}
.group>.disc+.disc,.group>.discbody+.disc{border-top:1px solid var(--line)}

/* tab bar */
.tabs{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:999px;width:min(380px,calc(100% - 32px))}
.tab{flex:1;border:0;background:transparent;color:var(--ink);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border-radius:999px;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.count{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* undo toast */
.toast{position:fixed;z-index:30;left:50%;transform:translate(-50%,20px);bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);white-space:nowrap}

.toast .cd{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:6px;border-radius:50%;background:var(--accent-ink);color:var(--accent);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.toast.glass{background:var(--ink);color:var(--bg);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 24px var(--shadow)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(640px,100%);max-height:85vh;overflow:auto;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  border-radius:28px 28px 0 0;border-bottom:0;padding:8px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px))}

.sheet h3{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sheet .need{color:var(--muted);font-size:15px;margin:0 0 16px}
.lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px 4px}

.sgroup div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:15px}

.cta .btn{flex:1;padding:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}

/* ---------- units & maths ---------- */
const ALIAS={"гр":"г","гр.":"г","грамм":"г","граммов":"г","грамма":"г","г.":"г","килограмм":"кг","кг.":"кг","литр":"л","литра":"л","л.":"л","миллилитров":"мл","мл.":"мл","шт.":"шт","штук":"шт","штуки":"шт","штука":"шт","ст. л.":"ст.л.","ст.л":"ст.л.","ст. л":"ст.л.","столовая ложка":"ст.л.","столовые ложки":"ст.л.","столовых ложек":"ст.л.","ч. л.":"ч.л.","ч.л":"ч.л.","ч. л":"ч.л.","чайная ложка":"ч.л.","чайные ложки":"ч.л.","чайных ложек":"ч.л.","зубчик":"зубч.","зубчика":"зубч.","зубчиков":"зубч.","зуб.":"зубч.","пучка":"пучок","пучков":"пучок","щепотки":"щепотка","щеп.":"щепотка"};
function normUnit(u,q){u=low(u);u=ALIAS[u]||u;if(q==null||q==="")return u&&u!=="по вкусу"?u:"по вкусу";return u||"шт"}
function fam(u){return({"г":["mass",1],"кг":["mass",1000],"мл":["vol",1],"л":["vol",1000]})[u]||[u,1]}
const SPOON={"ст.л.":15,"ч.л.":5,"щепотка":.5};
const PIECE={"зубч.":5,"пучок":30};
function trim(n,d){return Number(n.toFixed(d)).toLocaleString("ru-RU",{maximumFractionDigits:d})}
/* eggs, onions, cloves are used whole */
const PIECES=["шт","зубч.","пучок"];
function fmt(v,f){
  if(f==="по вкусу")return "по вкусу";
  const r=v<20?Math.round(v*2)/2:(Math.round(v/5)*5||Math.round(v));
  if(f==="mass")return v>=1000?trim(v/1000,2)+" кг":trim(r,1)+" г";
  if(f==="vol")return v>=1000?trim(v/1000,2)+" л":trim(r,1)+" мл";
  if(PIECES.includes(f))return Math.max(1,Math.ceil(v-1e-6))+" "+f;
  /* sprigs, slices, heads and other countable units are bought whole */
  return (SPOON[f]?trim(v,1):Math.max(1,Math.ceil(v-1e-6)))+" "+f;
}
function fmtIng(i,k){const u=normUnit(i.unit,i.qty);if(u==="по вкусу"||!(+i.qty>0))return"по вкусу";const [f,m]=fam(u);return fmt(i.qty*m*k,f)}
const isMV=f=>f==="mass"||f==="vol";
function gppOf(i){return i.gpp||lookup(i.name)?.gpp||null}
/* convert an amount v in family f to family `to`; null when impossible */
function conv(v,f,to,gpp){
  if(f===to)return v;
  if(isMV(to)){
    if(isMV(f))return v;
    if(SPOON[f])return v*SPOON[f];
    const g=gpp||PIECE[f];if(g&&(f==="шт"||PIECE[f]))return v*g;
  }
  if(to==="шт"&&isMV(f)&&gpp)return v/gpp;
  return null;
}
function ingGrams(i,k){
  const u=normUnit(i.unit,i.qty);if(u==="по вкусу")return 0;
  const [f,m]=fam(u);return conv((+i.qty||0)*m*k,f,"mass",gppOf(i));
}
function perOf(i){return i.per100||lookup(i.name)?.per100||null}
function recipeNut(r){
  const t={kcal:0,p:0,f:0,c:0};const miss=[];
  for(const i of r.ingredients){
    const g=ingGrams(i,1),per=perOf(i);
    if(g===0)continue;
    if(g==null||!per){miss.push(i.name);continue}
    for(const k in t)t[k]+=per[k]*g/100;
  }
  const s=r.servings||1;return{kcal:t.kcal/s,p:t.p/s,f:t.f/s,c:t.c/s,miss};
}

/* ---------- shopping list ---------- */
function packFor(gk,ings){
  const o=S.plan.packs[gk];if(o)return o.none?null:o;
  const L=lookup(ings[0].name);if(L&&L.user&&L.pack!==undefined)return L.pack;
  for(const i of ings)if(i.pack&&i.pack.size)return i.pack;
  return L?.pack||null;
}
function shoppingList(){
  const W=S.plan.week;const groups=new Map();
  /* A recipe is cooked once for all its portions planned this week, so amounts are
     scaled per recipe (planned portions / recipe portions) and whole items are rounded once. */
  const byRec=new Map();
  for(const x of entries(W)){
    const r=rById(x.e.rid);if(!r)continue;
    if(!byRec.has(r.id))byRec.set(r.id,{r,serv:0,slots:[]});
    const o=byRec.get(r.id);o.serv+=x.e.servings;o.slots.push(x);
  }
  for(const {r,serv,slots} of byRec.values()){
    const k=serv/(r.servings||1);
    const days=[...new Set(slots.sort((a,b)=>a.d-b.d).map(x=>DAYS_S[x.d]))].join(", ");
    const label=r.name+" · "+(serv===r.servings?"весь рецепт, ":"")+servShort(serv)+" · "+days;
    for(const i of r.ingredients){
      const d=lookup(i.name);const canon=(d&&d.canon)||i.name.trim();const gk=low(canon);
      if(canon==="Вода")continue;
      const u=normUnit(i.unit,i.qty);const [f,m]=fam(u);
      if(!groups.has(gk))groups.set(gk,{gk,name:i.name.trim(),cat:CATS.includes(i.cat)?i.cat:(d?.cat||"Другое"),pantry:false,ings:[],parts:[]});
      const g=groups.get(gk);g.ings.push(i);g.pantry=g.pantry||!!i.pantry||!!d?.pantry;
      const v=(+i.qty||0)*m*k;
      g.parts.push({label,f,v:f==="по вкусу"?0:PIECES.includes(f)||!(SPOON[f]||isMV(f))?Math.ceil(v-1e-6):v,gpp:gppOf(i)});
    }
  }
  const items=[];
  for(const g of groups.values()){
    const pack=packFor(g.gk,g.ings);
    const fams=[...new Set(g.parts.map(p=>p.f).filter(f=>f!=="по вкусу"))];
    const to=pack?fam(normUnit(pack.unit,1))[0]:(fams.find(f=>f==="mass")||fams.find(f=>f==="vol")||fams[0]||"по вкусу");
    const lines=new Map();
    for(const p of g.parts){
      if(p.f==="по вкусу"&&fams.length)continue;
      let f=to,v=p.f==="по вкусу"?0:conv(p.v,p.f,to,p.gpp);
      if(v==null){f=p.f;v=p.v}
      if(!lines.has(f))lines.set(f,{key:g.gk+"|"+f,gk:g.gk,name:g.name,cat:g.cat,pantry:g.pantry,f,v:0,parts:[]});
      const L=lines.get(f);L.v+=v;
      const prev=L.parts.find(q=>q.label===p.label);if(prev)prev.v+=v;else L.parts.push({label:p.label,v});
    }
    for(const L of lines.values()){
      if(!(L.v>0)&&L.f!=="по вкусу"){L.f="по вкусу";L.key=g.gk+"|по вкусу";L.v=0}
      if(pack&&fam(normUnit(pack.unit,1))[0]===L.f&&L.v>0){
        const size=pack.size*fam(normUnit(pack.unit,1))[1];
        const n=Math.max(1,Math.ceil(L.v/size-0.03));
        L.pack=pack;L.n=n;L.size=size;L.left=Math.max(0,n*size-L.v);
      }
      items.push(L);
    }
  }
  for(const x of S.plan.extras){const has=x.qty!=null&&x.qty!=="";const u=has?normUnit(x.unit,x.qty):"";const [f,m]=has?fam(u):["none",1];items.push({key:"x:"+x.id,gk:"x:"+x.id,name:x.name,f,v:has?(+x.qty||0)*m:0,cat:x.cat&&CATS.includes(x.cat)?x.cat:"Другое",pantry:false,parts:[],extra:x.id})}
  return items;
}
const atHome=()=>false;

function buyText(i){

}
const PERISH=["Овощи и зелень","Фрукты и ягоды","Мясо и птица","Рыба и морепродукты","Молочное и яйца","Хлеб и выпечка"];
function leftovers(items,keeps){
  return items.filter(i=>i.pack&&!atHome(i)&&(keeps?!PERISH.includes(i.cat):PERISH.includes(i.cat))&&i.left>=Math.max(i.size*0.12,i.f==="шт"||i.f==="зубч."?1:10)).map(i=>{
    const sugg=[];
    for(const r of S.recipes){
      const ing=r.ingredients.find(j=>low((lookup(j.name)?.canon)||j.name)===i.gk);if(!ing)continue;
      const u=normUnit(ing.unit,ing.qty);if(u==="по вкусу")continue;
      const [f,m]=fam(u);const per=conv((+ing.qty||0)*m/(r.servings||1),f,i.f,gppOf(ing));if(!per)continue;
      const n=Math.floor(i.left/per+0.05);if(n>=1&&n<=12)sugg.push({r,n,use:Math.min(i.left,n*per)});
    }
    sugg.sort((a,b)=>b.use-a.use);
    return {i,sugg:sugg.slice(0,3)};
  });
}

    return `<div class="dish"><span class="dn">${esc(r.name)}</span>

  <div class="week">${DAYS.map((dn,di)=>`<section class="day${di===today?" today":""}"><div class="dayname"><span>${dn}${di===today?'<span class="tod">сегодня</span>':""}</span>${kc[di]!=null?`<span class="kcal">≈ ${trim(kc[di],0)} ккал${normTag(kc[di])}</span>`:""}</div>
   ${MEALS.map(([m,ml])=>{const key=di+"-"+m;const list=entries(W).filter(x=>x.k===key);
    return `<div class="meal"><div class="meal-label">${ml}</div>${list.map(dish).join("")}
    ${S.recipes.length?`<select class="add-dish" id="add-${key}" data-k="${key}" aria-label="Добавить блюдо: ${dn}, ${ml}"><option value="">+ блюдо</option>${opts}</select>`:""}</div>`}).join("")}
  </section>`).join("")}</div>`;

function prodRows(){
  const P=S.products||{};const seen=new Set();
  const rows=DICT.map(d=>{const k=low(d.canon||d.label);const u=P[k];if(u)seen.add(k);return{name:d.label,cat:u?.cat||d.cat,pack:u&&u.pack!==undefined?u.pack:d.pack,per:u?.per100||d.per100,user:!!u}});

  return rows.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
}

const ING_SCHEMA=`{"name": string, "qty": number|null, "unit": string, "cat": string, "pantry": boolean, "pack": {"size": number, "unit": "г"|"мл"|"шт"|"зубч.", "name": string}|null, "per100": {"kcal": number, "p": number, "f": number, "c": number}|null, "gpp": number|null}`;

const RULES=`Правила для рецепта:
- name — короткое название блюда на русском. servings — число порций, только если оно прямо написано в рецепте («на 4 порции», «для 6 человек», «Servings: 4»); если не написано, servings = null, не угадывай. meals — на какие приёмы пищи подходит: b завтрак, l обед, d ужин.
- Названия ингредиентов как в магазине, в именительном падеже, с заглавной буквы: «Лук репчатый», «Сливки 20%», «Яйцо куриное».
- unit — только одно из: г, мл, шт, ст.л., ч.л., зубч., пучок, щепотка, по вкусу. Переводи кг→г, л→мл.
- Стаканы, чашки, cups, oz, lb и ложки для основных продуктов (мука, сахар, крупы, сметана, молоко, сливочное масло) переводи в г или мл. Ложки оставляй для специй, растительного масла и соусов.
- Овощи и фрукты, которые продают поштучно, указывай в шт, если не дан вес. qty = null только для «по вкусу».
- cat — одно из: ${CATS.join(", ")}.
- pantry = true для соли, молотого перца, воды, сахара в малых количествах, растительного масла до 3 ст.л. и сухих специй.
- pack — типичная упаковка в российском супермаркете: сметана 300 г «стакан», масло сливочное 180 г «пачка», яйца 10 шт «десяток», мука 1000 г «пачка», чеснок 10 зубч. «головка». null для продуктов на развес (овощи, мясо, рыба) и для pantry.
- per100 — калорийность и белки/жиры/углеводы на 100 г продукта. gpp — вес одной штуки в граммах для шт, зубч. и пучок, иначе null.
- Если один ингредиент встречается несколько раз (тесто и начинка), сложи количества.
- Если рецепт на другом языке, переведи на русский.`;
function normRecipe(x,src){
  const per=p=>p&&isFinite(+p.kcal)?{kcal:+p.kcal,p:+p.p||0,f:+p.f||0,c:+p.c||0}:null;
  const stated=Math.round(+x.servings)>0;
  const r={id:uid(),name:String(x.name||"Новый рецепт").trim(),servings:stated?Math.round(+x.servings):1,source:src||"",
    meals:(Array.isArray(x.meals)?x.meals:[]).filter(m=>MEAL_NAME[m]).length?x.meals.filter(m=>MEAL_NAME[m]):guessMeals(x.name||""),
    ingredients:(x.ingredients||[]).map(i=>({name:String(i.name||"").trim(),qty:i.qty==null?null:+i.qty,unit:normUnit(i.unit,i.qty),cat:CATS.includes(i.cat)?i.cat:"Другое",pantry:!!i.pantry,
      pack:i.pack&&+i.pack.size>0?{size:+i.pack.size,unit:normUnit(i.pack.unit,1),name:String(i.pack.name||"упаковка")}:null,per100:per(i.per100),gpp:+i.gpp>0?+i.gpp:null})).filter(i=>i.name)};
  if(!stated)Object.assign(r,guessServings(r));
  return r;
}
/* Portions not stated in the recipe: estimate from the cooked weight of the dish.
   Dry grains and pasta roughly triple when cooked; a portion is ~250 g for breakfast, ~350 g otherwise. */
function guessServings(r){
  let g=0;
  const grainy=r.ingredients.some(i=>{const n=low(i.name);return !/мук|сахар|крахмал/.test(n)&&(lookup(i.name)?.cat||i.cat)==="Крупы, макароны, мука"});
  for(const i of r.ingredients){
    const w=ingGrams(i,1);if(!w)continue;
    const d=lookup(i.name);const n=low(i.name);
    /* water: soaked up by grains, otherwise partly boils away */
    if(d?.canon==="Вода"||/^бульон/.test(n)){if(!grainy)g+=w*.8;continue}
    const swell=/мук/.test(n)?1.3:(d?.cat==="Крупы, макароны, мука"||i.cat==="Крупы, макароны, мука")&&!/сахар|крахмал/.test(n)?2.7:1;
    g+=w*swell;
  }
  const size=(r.meals||[]).length===1&&r.meals[0]==="b"?250:350;
  const n=Math.max(1,Math.round(g/size));
  return{servings:n,guess:{grams:Math.round(g),size}};
}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL("image/jpeg",.85);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
    return{dataUrl,blob};
  }finally{URL.revokeObjectURL(url)}
}

/* one phrase, many items: "хлеб, 2 литра молока и туалетная бумага" — typed or dictated with the keyboard microphone */
const NUMW={"один":1,"одна":1,"одно":1,"два":2,"две":2,"три":3,"четыре":4,"пять":5,"шесть":6,"семь":7,"восемь":8,"девять":9,"десять":10,"полтора":1.5,"полторы":1.5};
/* Split a spoken list into items even without commas: "хлеб два литра молока кофе туалетная бумага".
   A noun closes an item, an adjective sticks to the next word, a number starts a new item when a product follows it. */
const NUMWORD=/^(\d+([.,]\d+)?|\d+\/\d+|один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|полтора|полторы|пол|полкило|кило|десяток|пара|пару)$/i;
const UNITWORD=/^(кг|килограмм\S*|г|гр|грамм\S*|л|литр\S*|мл|шт|штук\S*|пачк\S*|бутыл\S*|банк\S*|упаков\S*|пакет\S*|бутылк\S*|коробк\S*|кусок|куска|кусков|головк\S*|пучк\S*|пучок|десятк\S*)$/i;
const FILLER=/^(и|а|ещё|еще|также|плюс|потом|нужно|надо|купить|возьми|взять)$/i;
const NOT_ADJ=/^(мороженое|пирожное|жаркое|кофе|какао|печенье|варенье|желе|пюре|филе|рагу|соте)$/i;
const isAdj=w=>!NOT_ADJ.test(w)&&/(ая|яя|ый|ий|ой|ое|ее|ые|ие|ых|их|ого|его)$/i.test(w);
function splitSpoken(chunk){
  const t=chunk.split(/\s+/).filter(Boolean);const out=[];let cur=[];let noun=false,post=false;
  const close=()=>{if(cur.length)out.push(cur.join(" "));cur=[];noun=false;post=false};
  const nominative=w=>{const d=lookup(w);return d?low(d.canon||d.label).split(/[ ,]/)[0]===low(w):!/(а|я|ы|и|ов|ев|ей|ц)$/i.test(w)};
  for(let i=0;i<t.length;i++){
    const w=t[i];
    if(FILLER.test(w)){if(noun)close();continue}
    if(NUMWORD.test(w)){
      let j=i+1;if(j<t.length&&UNITWORD.test(t[j]))j++;
      const product=j<t.length&&!NUMWORD.test(t[j])&&!FILLER.test(t[j]);
      /* "два литра молока" (genitive) is a new item; "молоко 2 литра хлеб" keeps the amount with молоко */
      const k=product&&isAdj(t[j])&&j+1<t.length?j+1:j;
      if(noun&&product&&!nominative(t[k]))close();else if(noun)post=true;
      cur.push(w);continue;
    }
    if(UNITWORD.test(w)){cur.push(w);continue}
    if(isAdj(w)){if(noun&&i<t.length-1)close();cur.push(w);continue}
    const last=cur[cur.length-1]||"";
    if(noun&&(post||!(NUMWORD.test(last)||UNITWORD.test(last))))close();
    cur.push(w);noun=true;
  }
  close();return out;
}
function parseExtras(text){
  return text.split(/[,;\n]+|\s+и\s+|\s+а также\s+/i).map(x=>x.trim().replace(/[.!]+$/,"")).filter(Boolean).flatMap(splitSpoken).map(part=>{
    const p=part.replace(/(^|\s)десяток(?=\s|$)/gi,"$110 шт").replace(/(^|\s)полкило(?=\s|$)/gi,"$1500 г").replace(/(^|\s)кило(?=\s|$)/gi,"$11 кг").replace(/(^|\s)(один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|полтора|полторы)(?=\s)/gi,(m,a,w)=>a+NUMW[w.toLowerCase()]);
    const r=parseLine(p);
    if(r){const d=lookup(r.name);if(d&&!d.canon&&d.label&&!/[,(]/.test(d.label)&&low(d.label).split(" ")[0]!==low(r.name).split(" ")[0])r.name=d.label}
    if(r&&r.qty!=null)return{name:r.name,qty:r.qty,unit:r.unit==="стакан"?"шт":r.unit,cat:CATS.includes(r.cat)&&r.cat!=="Другое"?r.cat:(lookup(r.name)?.cat||"Другое")};
    const name=(r&&r.name)||part[0].toUpperCase()+part.slice(1);
    return{name,qty:null,unit:"",cat:lookup(name)?.cat||"Другое"};
  });
}

/* ---------- parsing without AI ---------- */
/* Quantity = number + unit. Explicit weight/volume wins over glasses, spoons and pieces. */
const NUM_RE="\\d+\\s+\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:\\s*[-–—]\\s*\\d+(?:[.,]\\d+)?)?|\\d+\\/\\d+|½|¼|¾|пол";
const UNIT_RE="кг|килограмм\\S*|грамм\\S*|гр\\.?|г\\.?|миллилитр\\S*|мл\\.?|литр\\S*|л\\.?|шт\\.?|штук\\S*|ст\\.\\s?л\\.?|ст\\.?\\s?ложк\\S*|столов\\S*\\s+ложк\\S*|ч\\.\\s?л\\.?|ч\\.?\\s?ложк\\S*|чайн\\S*\\s+ложк\\S*|зубч\\S*|зуб\\.|пуч\\S*|щеп\\S*|стакан\\S*|головк\\S*|банк\\S*|пачк\\S*|упаковк\\S*|вет[оа]ч\\S*|веток|ломтик\\S*|дольк\\S*|долек|кусоч\\S*|кус(?:ок|ка|ков)|лист(?:ик)?\\S*|стеб\\S*|кочан\\S*|щеп\\.";
const QTY_RE=new RegExp("(?<![а-яё\\d])("+NUM_RE+")\\s*("+UNIT_RE+")(?![а-яё])","gi");
function toNum(s){s=s.toLowerCase();if(s==="пол"||s==="½")return .5;if(s==="¼")return .25;if(s==="¾")return .75;if(s.includes("/")){const w=s.trim().split(/\s+/);const [a,b]=w.pop().split("/");return (w.length?+w[0]:0)+a/b}s=s.replace(/,/g,".");if(/[-–—]/.test(s))s=s.split(/[-–—]/)[1];return parseFloat(s)}
function unitOf(u){
  u=u.toLowerCase().replace(/\s+/g," ");
  if(/^кг|^килогр/.test(u))return["г",1000];
  if(/^г/.test(u)&&!/^головк/.test(u))return["г",1];
  if(/^мл|^миллил/.test(u))return["мл",1];
  if(/^л|^литр/.test(u))return["мл",1000];
  if(/^шт|^штук/.test(u))return["шт",1];
  if(/^ст|^столов/.test(u)&&!/^стакан/.test(u))return["ст.л.",1];
  if(/^ч|^чайн/.test(u))return["ч.л.",1];
  if(/^зуб/.test(u))return["зубч.",1];
  if(/^пуч/.test(u))return["пучок",1];
  if(/^щеп/.test(u))return["щепотка",1];
  if(/^головк/.test(u))return["зубч.",10];
  if(/^стакан/.test(u))return["стакан",1];
  if(/^вет|^веток/.test(u))return["веточка",1];
  if(/^ломт/.test(u))return["ломтик",1];
  if(/^дол/.test(u))return["долька",1];
  if(/^кус/.test(u))return["кусок",1];
  if(/^лист/.test(u))return["лист",1];
  if(/^стеб/.test(u))return["стебель",1];
  if(/^кочан/.test(u))return["кочан",1];
  return["шт",1];
}
const RANK={"веточка":1,"ломтик":1,"долька":1,"кусок":1,"лист":1,"стебель":1,"кочан":1,"г":0,"мл":0,"шт":1,"зубч.":1,"пучок":1,"ст.л.":2,"ч.л.":2,"щепотка":2,"стакан":3};
function cleanName(n){
  n=n.replace(/\([^)]*\)/g," ").replace(/\[[^\]]*\]/g," ")
     .replace(/(^|\s)(в сухом виде|по вкусу|для подачи|по желанию|для жарки|для смазывания|примерно|около|небольш\S*|крупн\S*|средн\S*|свеж\S*)(?=\s|$|[.,;])/gi," ")
     .replace(/[.;:!]+$/,"").split(/,|\s[-–—]\s/)[0].replace(/\s+/g," ").trim();
  return n.replace(/^[-–—,.\s]+|[-–—,.\s]+$/g,"");
}
function parseLine(raw){
  const l=raw.replace(/^\s*(?:[•\-*·–—▪◦]|\d+[.)](?!\d))\s*/,"").trim();
  if(!l||l.length>140||/порци|персон|человек|минут|час[аов]?(\s|$)|градус|°/i.test(l)||/:\s*$/.test(l)||/^(ингредиент|для |способ|приготовлени|шаг )/i.test(l))return null;
  const ms=[...l.matchAll(QTY_RE)].map(m=>{const [u,k]=unitOf(m[2]);return{m,u,q:toNum(m[1])*k}}).filter(x=>isFinite(x.q));
  /* name = text before the dash or colon; otherwise the line without its quantities */
  const sep=l.match(/\s[—–-]\s|\s?—\s?|:\s/);
  let name=sep&&sep.index>0?l.slice(0,sep.index):ms.reduce((t,x)=>t.replace(x.m[0]," "),l);
  name=cleanName(name);
  if(!name||name.length>60)return null;
  const d=lookup(name);
  const first=w=>low(w).split(/\s+/)[0];
  if(d&&d.canon&&first(name)!==first(d.canon))name=d.canon;else name=name[0].toUpperCase()+name.slice(1);
  let qty=null,unit="по вкусу";
  if(ms.length){
    ms.sort((a,b)=>RANK[a.u]-RANK[b.u]);let {q,u}=ms[0];
    if(u==="стакан"){const g=d?.canon==="Мука пшеничная"?130:d?.canon==="Сахар"?200:d?.cat==="Крупы, макароны, мука"?190:0;if(g){u="г";q*=g}else{u="мл";q*=200}}

    else if(bare&&sep&&/^\s*[\d.,]+\s*$/.test(l.slice(sep.index+sep[0].length))){qty=toNum(bare[1]);unit="шт"}
    else if(!(d||/по вкусу|для подачи|по желанию/i.test(l))||l.length>50)return null;
  }

}
function parseLocal(){
  const text=document.getElementById("impText").value;UI.impText=text;UI.impUrl="";
  if(!text.trim()&&(UI.photos||[]).length){setMsg("import","Фото разбирает только ИИ. Нажмите «Разобрать с ИИ».",true);return}
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){setMsg("import","Вставьте текст рецепта.",true);return}
  let servings=0;const sm=text.match(/(\d+)\s*(порци|персон|человек)/i);if(sm)servings=+sm[1];
  const ings=[];let name="";
  const all=lines.flatMap(l=>{const m=l.match(/^(.*?)\s*[—–:-]\s*по вкусу/i);return m&&m[1].includes(",")?m[1].replace(/^\s*[•*·–—-]\s*/,"").split(",").map(x=>x.trim()+" — по вкусу"):[l]});
  for(const l of all){
    if(/^(способ\s+)?приготовлени|^шаг\s*\d|^инструкц|^как готовить/i.test(l))break;
    const r=parseLine(l);
    if(!r){if(!name&&!ings.length&&l.length<60&&!/ингредиент/i.test(l))name=l.replace(/\s*(на\s*)?\d+\s*(порци|персон|человек)\S*/i,"").replace(/[.:]+$/,"").trim();continue}

  setMsg("import","");

  if(!servings)Object.assign(rec,guessServings(rec));
  openEditor(rec,true);
}
function localMenu(){
  const o=UI.menuOpts;
  if(!S.recipes.length){setMsg("menu","Сначала добавьте хотя бы пару рецептов.",true);return}
  if(!o.meals.length)return;
  /* each recipe gives at most r.servings portions for the whole week */
  const people=S.plan.people;const week={};const cnt={};const last={};const left={};let empty=0;
  S.recipes.forEach(r=>left[r.id]=r.servings||1);
  const pool=m=>{const p=S.recipes.filter(r=>(r.meals||[]).includes(m));return p.length?p:S.recipes};
  for(let d=0;d<7;d++)for(const m of o.meals){
    const key=d+"-"+m;if(week[key])continue;
    const today=o.meals.flatMap(mm=>(week[d+"-"+mm]||[]).map(x=>x.rid));
    const avail=pool(m).filter(r=>left[r.id]>0);
    let c=avail.filter(r=>!today.includes(r.id));if(!c.length)c=avail;
    if(!c.length){empty++;continue}
    c=c.map(r=>({r,s:(cnt[r.id]||0)*10+(last[r.id]===d-1?5:0)+Math.random()})).sort((a,b)=>a.s-b.s);
    const r=c[0].r;const sv=Math.min(people,left[r.id]);left[r.id]-=sv;
    const e={id:uid(),rid:r.id,servings:sv};week[key]=[e];cnt[r.id]=(cnt[r.id]||0)+1;last[r.id]=d;
    if(o.batch&&m!=="b"&&d<6&&left[r.id]>0&&!week[(d+1)+"-"+m]){const s2=Math.min(people,left[r.id]);left[r.id]-=s2;week[(d+1)+"-"+m]=[{id:uid(),rid:r.id,servings:s2,of:e.id}];cnt[r.id]++;last[r.id]=d+1}
  }
  UI.preview={week,recipes:[],note:"Меню собрано из ваших рецептов: каждое блюдо стоит столько раз, сколько порций в рецепте."+(empty?` На ${empty} приём. пищи порций не хватило: добавьте рецепты или увеличьте число порций.`:"")};render();
}

function recipeText(r){
  const byCat={};r.ingredients.forEach(i=>{const c=CATS.includes(i.cat)?i.cat:"Другое";(byCat[c]=byCat[c]||[]).push(i)});
  return r.name+" на "+r.servings+" "+servWord(r.servings)+"\n\nИнгредиенты:\n"+CATS.filter(c=>byCat[c]).map(c=>byCat[c].map(i=>"— "+i.name+" — "+fmtIng(i,1)).join("\n")).join("\n")+(r.source?"\n\nИсточник: "+r.source:"");
}
/* the iPhone share sheet where it is available, otherwise copy */
async function share(text,title,msgId){
  if(navigator.share){try{await navigator.share({title,text});return}catch(e){if(e&&e.name==="AbortError")return}}
  copy(text,msgId);
}
function go(t){UI.tab=t;try{if(t!=="settings")localStorage.setItem("kz-tab",t)}catch(e){}render();window.scrollTo({top:0})}
function rmEntry(W,id){for(const k of Object.keys(W)){W[k]=W[k].filter(e=>e.id!==id);if(!W[k].length)delete W[k]}for(const x of entries(W))if(x.e.of===id)delete x.e.of}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="check")return;
  const W=S.plan.week;
  switch(a){
    case "tab":go(b.dataset.tab);break;
    case "clearExamples":S={recipes:[],plan:Object.assign(emptyPlan(),S.plan.norm?{norm:S.plan.norm}:{}),products:S.products||{}};isExample=false;UI.sel=null;UI.editor=null;UI.preview=null;localSave();if(store.mode==="db")serial(()=>col().doc("plan").set(clean(S.plan)));render();break;
    case "clearWeek":materialize();undoable("Неделя очищена");S.plan.week={};S.plan.checks={};S.plan.removed={};savePlan();render();break;
    case "clearList":{materialize();undoable("Список очищен");S.plan.removed=S.plan.removed||{};
      for(const i of shoppingList())if(!i.extra)S.plan.removed[i.key]=i.v;
      S.plan.extras=[];S.plan.checks={};savePlan();render();break}
    case "rmItem":{const i=shoppingList().find(x=>x.key===b.dataset.key);if(!i)return;materialize();S.plan.removed=S.plan.removed||{};S.plan.removed[i.key]=i.v;delete S.plan.checks[i.key];UI.sheet=null;savePlan();render();break}
    case "delAll":{materialize();undoable("Все рецепты удалены");const ids=S.recipes.map(r=>r.id);S.recipes=[];S.plan.week={};S.plan.checks={};
      ids.forEach(deleteRecipeStore);savePlan();UI.sel=null;UI.editor=null;render();break}
    case "undo":{const u=UI.undo;if(!u)return;S.recipes=u.snap.recipes;S.plan=u.snap.plan;migrate();
      if(store.mode==="db"){S.recipes.forEach(saveRecipe);savePlan()}else localSave();UI.undo=null;clearInterval(UI.undoT);render();break}
    case "togglePlanner":UI.planner=!UI.planner;render();break;
    case "people":materialize();S.plan.people=Math.max(1,S.plan.people+ +b.dataset.d);savePlan();render();break;
    case "rmDish":materialize();rmEntry(W,b.dataset.id);UI.sheet=null;savePlan();render();break;
    case "serv":{materialize();const x=findEntry(W,b.dataset.id);if(+b.dataset.d>0&&leftOf(rById(x.e.rid))<=0)return;x.e.servings=Math.max(1,x.e.servings+ +b.dataset.d);savePlan();render();break}
    case "batch":{materialize();const x=findEntry(W,b.dataset.id);const k=(x.d+1)+"-"+x.m;(W[k]=W[k]||[]).push({id:uid(),rid:x.e.rid,servings:x.e.servings,of:x.e.id});savePlan();render();break}
    case "menuLocal":localMenu();break;
    case "menuAI":UI.menuOpts.wish=document.getElementById("moWish").value;menuAI();break;
    case "applyPreview":{materialize();const P=UI.preview;P.recipes.forEach(r=>{r.created=Date.now();S.recipes.push(r);saveRecipe(r)});
      S.plan.week=P.week;S.plan.checks={};UI.preview=null;UI.planner=false;savePlan();render();break}
    case "discardPreview":UI.preview=null;render();break;
    case "openRecipe":UI.sel=b.dataset.id;UI.scale=null;UI.addServ=null;UI.editor=null;go("recipes");showDetail();break;
    case "newImport":UI.sel=null;UI.editor=null;render();showDetail();document.getElementById("impText")?.focus();break;
    case "scale":{materialize();const r=rById(UI.sel);const ns=Math.max(1,r.servings+ +b.dataset.d);if(ns===r.servings)return;
      /* changing portions rescales the recipe itself, so the week sees the new count */
      const k=ns/r.servings;r.ingredients.forEach(i=>{if(i.qty!=null)i.qty=i.qty*k});r.servings=ns;UI.scale=null;
      if(store.mode==="db"){clearTimeout(UI.scaleT);UI.scaleT=setTimeout(()=>saveRecipe(r),600)}else saveRecipe(r);render();break}
    case "addToPlan":{const r=rById(b.dataset.id);const sv=Math.min(UI.addServ||S.plan.people,leftOf(r));if(sv<=0)return;materialize();const k=document.getElementById("slotSel").value;(W[k]=W[k]||[]).push({id:uid(),rid:r.id,servings:sv});UI.addServ=null;savePlan();render();const m=document.getElementById("addedMsg");if(m){m.textContent="Добавлено: "+DAYS[+k.split("-")[0]].toLowerCase()+", "+MEAL_NAME[k.split("-")[1]]+" ✓";setTimeout(()=>{if(m.isConnected)m.textContent=""},2000)}break}
    case "shareRecipe":share(recipeText(rById(UI.sel)),rById(UI.sel).name,"copiedR");break;
    case "addServ":{const r=rById(UI.sel);UI.addServ=Math.max(1,Math.min(leftOf(r),Math.min(UI.addServ||S.plan.people,leftOf(r))+ +b.dataset.d));}render();break;
    case "edit":openEditor(rById(b.dataset.id),false);break;
    case "delRecipe":{materialize();const id=b.dataset.id;S.recipes=S.recipes.filter(r=>r.id!==id);entries(W).filter(x=>x.e.rid===id).forEach(x=>rmEntry(W,x.e.id));deleteRecipeStore(id);savePlan();UI.sel=null;render()}break;
    case "parseAI":parseAI();break;
    case "parseText":parseText();break;
    case "parsePhotos":parsePhotos();break;
    case "stopAI":aiCtl?.abort();break;
    case "parseLocal":parseLocal();break;
    case "manual":UI.impText=document.getElementById("impText").value;openEditor({name:"",servings:2,source:"",ingredients:[{name:"",qty:null,unit:"г",cat:"Другое",pantry:false}]},true);break;
    case "addRow":UI.editor.ingredients.push({name:"",qty:null,unit:"г",cat:"Другое",pantry:false});render();document.getElementById("ei-n-"+(UI.editor.ingredients.length-1))?.focus();break;
    case "rmRow":UI.editor.ingredients.splice(+b.dataset.i,1);render();break;
    case "cancelEditor":UI.editor=null;render();break;
    case "saveEditor":{
      const ed=UI.editor;ed.ingredients=ed.ingredients.filter(i=>i.name.trim());
      const st=document.getElementById("edStatus");
      if(!ed.name.trim()){st.textContent="Укажите название блюда.";return}
      if(!ed.ingredients.length){st.textContent="Добавьте хотя бы один ингредиент.";return}
      if(!ed.meals.length){st.textContent="Отметьте, на какой приём пищи подходит блюдо.";return}
      materialize();
      const r={id:ed.id,name:ed.name.trim(),servings:Math.max(1,Math.round(+ed.servings||1)),source:ed.source||"",meals:ed.meals,created:ed.created||Date.now(),
        ingredients:ed.ingredients.map(i=>{const d=lookup(i.name);return Object.assign({},i,{name:i.name.trim(),qty:i.unit==="по вкусу"||i.qty===""||i.qty==null?null:+i.qty,pantry:i.pantry??!!d?.pantry})})};
      const ix=S.recipes.findIndex(x=>x.id===r.id);if(ix>=0)S.recipes[ix]=r;else S.recipes.push(r);
      for(const i of r.ingredients){const L=lookup(i.name);const d={};
        if(i.cat&&i.cat!=="Другое"&&(!L||L.cat!==i.cat))d.cat=i.cat;
        if(!L){if(i.per100)d.per100=i.per100;if(i.pack)d.pack=i.pack;if(i.gpp)d.gpp=i.gpp}
        if(Object.keys(d).length)learn(i.name,d)}
      saveRecipe(r);if(ed.isNew){UI.impText="";UI.impUrl=""}UI.editor=null;UI.sel=r.id;UI.scale=null;render();break}
    case "home":{materialize();const k=b.dataset.key;const it=shoppingList().find(i=>i.key===k);const want=b.dataset.h!=="1";
      if(it&&want===it.pantry)delete S.plan.home[k];else S.plan.home[k]=want;savePlan();render();break}
    case "aiSave":{const c=UI.aiDraft;try{localStorage.setItem("kz-ai",JSON.stringify(c))}catch(e){}setMsg("ai","Сохранено.");break}
    case "aiTest":{const c=UI.aiDraft;UI.busy="ai";UI.msg.ai={t:"Проверяю…"};render();aiCtl=new AbortController();
      callAI('Ответь только JSON без пояснений: {"ok": true}',aiCtl.signal,c).then(r=>{UI.busy=null;UI.msg.ai=r&&r.ok?{t:"Подключение работает. Не забудьте сохранить."}:{t:"Сервис ответил, но не в том формате. Попробуйте другую модель.",err:true};render()})
        .catch(e=>{UI.busy=null;UI.msg.ai={t:e.code==="http"?"Сервис вернул ошибку: "+e.message:(ERRS[e.code]||"Не получилось подключиться."),err:true};render()});break}
    case "exportData":copy(JSON.stringify({app:"korzina",v:1,recipes:S.recipes,plan:S.plan,products:S.products||{}}),"copiedD");break;
    case "importData":{let d;try{d=JSON.parse(document.getElementById("impData").value)}catch(e){setMsg("data","Это не похоже на данные приложения. Скопируйте их кнопкой «Скопировать мои данные» и вставьте целиком.",true);return}
      if(!d||!Array.isArray(d.recipes)){setMsg("data","В тексте нет рецептов. Скопируйте данные целиком.",true);return}
      if(!arm("imp",b,"Точно заменить всё?"))return;
      const old=S.recipes.map(r=>r.id);S={recipes:d.recipes,plan:d.plan||emptyPlan(),products:d.products||S.products||{}};lkCache.clear();isExample=false;migrate();if(store.mode==="db")saveProducts();
      if(store.mode==="db"){old.filter(id=>!S.recipes.some(r=>r.id===id)).forEach(deleteRecipeStore);S.recipes.forEach(saveRecipe);savePlan()}else localSave();
      UI.msg.data={t:"Загружено: рецептов "+S.recipes.length+"."};render();break}
    case "theme":try{localStorage.setItem("kz-theme",b.dataset.v)}catch(e){}applyTheme();applyPalette();render();break;
    case "rmPhoto":UI.photos.splice(+b.dataset.i,1);render();break;
    case "dishMenu":UI.sheet={t:"dish",id:b.dataset.id};render();break;
    case "itemSheet":UI.sheet={t:"item",key:b.dataset.key};render();break;
    case "closeSheet":UI.sheet=null;render();break;
    case "pal":setPal({id:b.dataset.v});render();break;
    case "setToggle":UI.setOpen=UI.setOpen||{};UI.setOpen[b.dataset.k]=!UI.setOpen[b.dataset.k];render();break;
    case "toggleItem":UI.open=UI.open===b.dataset.key?null:b.dataset.key;UI.packEdit=null;render();break;
    case "packEdit":UI.packEdit=UI.packEdit===b.dataset.g?null:b.dataset.g;render();document.getElementById("pk-size")?.focus({preventScroll:true});break;
    case "packCancel":UI.packEdit=null;render();break;
    case "packSave":{const size=+document.getElementById("pk-size").value;if(!(size>0))return;materialize();delete S.plan.packs[b.dataset.g];learn(b.dataset.nm,{pack:{size,unit:b.dataset.u,name:b.dataset.n}});UI.packEdit=null;UI.sheet=null;savePlan();render();break}
    case "packNone":materialize();S.plan.packs[b.dataset.g]={none:true};UI.packEdit=null;savePlan();render();break;
    case "shareShop":share(shopText(),"Список покупок","copiedS");break;
    case "resetChecks":S.plan.checks={};savePlan();render();break;
    case "addExtra":{const n=document.getElementById("exName").value.trim();if(!n)return;materialize();parseExtras(n).forEach(x=>S.plan.extras.push({id:uid(),...x}));savePlan();render();break}
    case "rmExtra":S.plan.extras=S.plan.extras.filter(x=>x.id!==b.dataset.id);UI.sheet=null;savePlan();render();break;
    case "extraSheet":UI.sheet={t:"extra",id:b.dataset.id};render();break;
    case "extraSave":{const x=S.plan.extras.find(e=>e.id===b.dataset.id);if(!x)return;materialize();
      const nm=document.getElementById("xName").value.trim();if(nm)x.name=nm;
      const q=document.getElementById("xQty").value;x.qty=q===""?null:+q;x.unit=x.qty==null?"":document.getElementById("xUnit").value;
      x.cat=document.getElementById("xCat").value;if(x.cat!=="Другое")learn(x.name,{cat:x.cat});
      UI.sheet=null;savePlan();render();break}
    case "ideasAI":ideasAI();break;
    case "saveIdea":openEditor(UI.ideas[+b.dataset.i].recipe,true);window.scrollTo({top:0});break;
  }
});
document.body.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("select.add-dish")&&t.value){const r=rById(t.value);const sv=Math.min(S.plan.people,leftOf(r));if(sv<=0){render();return}materialize();(S.plan.week[t.dataset.k]=S.plan.week[t.dataset.k]||[]).push({id:uid(),rid:t.value,servings:sv});savePlan();render();return}
  if(t.dataset.ai==="preset"){const p=PRESETS[t.value];UI.aiDraft=Object.assign({},UI.aiDraft,{preset:t.value,url:p.url||"",model:p.model||""});render();return}
  if(t.id==="slotSel"){UI.slot=t.value;render();return}
  if(t.id==="normIn"){const v=Math.round(+t.value);materialize();if(v>0)S.plan.norm=v;else delete S.plan.norm;savePlan();render();return}
  if(t.id==="impPhoto"&&t.files.length){UI.impText=document.getElementById("impText").value;addPhotos([...t.files]);return}
  if(t.dataset.move&&t.value){materialize();const W=S.plan.week;const x=findEntry(W,t.dataset.move);if(!x)return;
    W[x.k].splice(x.i,1);if(!W[x.k].length)delete W[x.k];(W[t.value]=W[t.value]||[]).push(x.e);UI.dishMenu=null;UI.sheet=null;savePlan();render();return}
  if(t.dataset.a==="check"){materialize();if(t.checked)S.plan.checks[t.dataset.key]=true;else delete S.plan.checks[t.dataset.key];savePlan();render();return}
  if(t.dataset.mo){const o=UI.menuOpts;if(t.dataset.mo==="batch")o.batch=t.checked;else o.meals=MEALS.map(x=>x[0]).filter(m=>m===t.dataset.mo?t.checked:o.meals.includes(m));return}
  if(t.dataset.edm){const ed=UI.editor;ed.meals=MEALS.map(x=>x[0]).filter(m=>m===t.dataset.edm?t.checked:ed.meals.includes(m));return}
  if(t.dataset.ei!=null){const i=UI.editor.ingredients[+t.dataset.ei];i[t.dataset.f]=t.dataset.f==="qty"?(t.value===""?null:+t.value):t.value;if(t.dataset.f==="unit"&&t.value==="по вкусу")i.qty=null}
});
/* iOS web apps sometimes leave fixed bars (tab bar, background) lifted by the keyboard's height after it closes;
   a 1px scroll nudge makes Safari recompute the viewport */
function fixViewport(){setTimeout(()=>{const y=scrollY;scrollTo(scrollX,y+1);scrollTo(scrollX,y)},60)}
document.addEventListener("focusout",e=>{if(e.target.matches?.("input,textarea,select"))fixViewport()});
if(window.visualViewport){let h=visualViewport.height;visualViewport.addEventListener("resize",()=>{if(visualViewport.height>h+80)fixViewport();h=visualViewport.height})}
document.body.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="prodQ"){const q=low(t.value);let n=0;document.querySelectorAll("#plist .prow").forEach(r=>{const on=!q||r.dataset.s.includes(q);r.hidden=!on;if(on)n++});document.getElementById("pnone").hidden=n>0;return}
  if(t.id==="hue"){setPal({id:"custom",h:+t.value});document.querySelectorAll("[data-a=pal]").forEach(x=>x.setAttribute("aria-checked","false"));return}
  if(t.dataset.ai&&t.dataset.ai!=="preset"){UI.aiDraft[t.dataset.ai]=t.value}
  else if(t.id==="edServ"&&UI.editor.guess){UI.editor.servings=t.value;delete UI.editor.guess;t.classList.remove("warnf");document.getElementById("servHint")?.remove()}
  else if(t.dataset.ed){UI.editor[t.dataset.ed]=t.value}
  else if(t.dataset.ei!=null&&t.tagName==="INPUT"){const i=UI.editor.ingredients[+t.dataset.ei];i[t.dataset.f]=t.dataset.f==="qty"?(t.value===""?null:+t.value):t.value;if(t.dataset.f==="name"){delete i.per100;delete i.pack;delete i.gpp}}
  else if(t.id==="impText")UI.impText=t.value;else if(t.id==="moWish")UI.menuOpts.wish=t.value;
});
document.body.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="exName")app.querySelector('[data-a="addExtra"]').click()});
boot();
</script>
